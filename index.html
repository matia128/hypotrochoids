<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hypotrochoid Roulette</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: fixed;
      top: 40px;
      left: 20px;
      min-width: 300px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 10px 12px;
      padding-right: 22px;
      background: rgba(40, 40, 40, 0.75);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
    }
    #ui::-webkit-scrollbar {
      width: 4px;
    }
    #ui::-webkit-scrollbar-track {
      background: transparent;
    }
    #ui::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    #ui label {
      font-size: 13px;
      display: block;
      margin-top: 15px;
      margin-bottom: 10px;
    }
    #ui label:first-of-type {
      margin-top: 5px;
    }
    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      margin-left: 4px;
      font-size: 11px;
      font-style: italic;
      font-weight: 600;
      color: #888;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      cursor: default;
      vertical-align: middle;
    }
    .info-icon:hover {
      color: #aaa;
      background: rgba(255, 255, 255, 0.15);
    }
    #freqs {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .step-grid {
      margin-bottom: 8px;
    }
    #colorStep {
      display: block;
      width: 100%;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #444;
      border-radius: 2px;
    }
    #colorStep::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #eee;
      border: 1px solid #666;
      cursor: pointer;
    }
    .rho-row {
      margin-bottom: 12px;
      width: 100%;
    }
    .rho-line {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      width: 100%;
    }
    .rho-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #444;
      border-radius: 2px;
    }
    .rho-slider::-webkit-slider-runnable-track {
      background: #444;
      height: 4px;
      border-radius: 2px;
    }
    .rho-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #eee;
      border: 1px solid #666;
      cursor: pointer;
      margin-top: -3px;
    }
    .rho-slider::-moz-range-track {
      background: #444;
      height: 4px;
      border-radius: 2px;
    }
    .rho-slider::-moz-range-progress {
      background: #444;
      height: 4px;
      border-radius: 2px;
    }
    .rho-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #eee;
      border: 1px solid #666;
      cursor: pointer;
    }
    .rho-ticks {
      position: relative;
      display: flex;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      font-size: 10px;
      color: #aaa;
    }
    .rho-play {
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
      min-width: 28px;
      line-height: 1;
      margin-left: 4px;
    }
    .rho-play.active {
      border-color: #3b82f6;
      background: #1e3a8a;
    }
    .palette-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .palette-btn {
      width: 100%;
      padding: 4px 0;
      background: #222;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    .palette-btn.active {
      border-color: #3b82f6;
      background: #1e3a8a;
      color: #fff;
      border-radius: 3px 3px 0 0;
    }
    .palette-rnd-btn {
      display: none;
      width: 100%;
      padding: 3px 0;
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #3b82f6;
      border-top: none;
      border-radius: 0 0 3px 3px;
      cursor: pointer;
      font-size: 10px;
    }
    .palette-col.active .palette-rnd-btn { display: block; }
    .palette-rnd-btn:hover { background: #222; color: #eee; }
    .palette-rnd-btn.active {
      background: #1e3a8a;
      color: #fff;
    }
    #hueSlider {
      display: block;
      width: 100%;
      margin-top: 5px;
      -webkit-appearance: none;
      appearance: none;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right,
        hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%),
        hsl(90,100%,50%), hsl(120,100%,50%), hsl(150,100%,50%),
        hsl(180,100%,50%), hsl(210,100%,50%), hsl(240,100%,50%),
        hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%),
        hsl(359,100%,50%));
      cursor: pointer;
    }
    #hueSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #000;
      cursor: pointer;
    }
    #playAllBtn, #resetRhosBtn, #randomRhosBtn {
      flex: 1;
      padding: 4px 0;
      background: #222;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    #playAllBtn.active, #randomRhosBtn.active {
      border-color: #3b82f6;
      background: #1e3a8a;
      color: #fff;
    }
    #sliderTooltip {
      position: fixed;
      transform: translateX(-50%);
      background: #333;
      color: #eee;
      font-size: 12px;
      padding: 2px 5px;
      border-radius: 3px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
      z-index: 1000;
    }
    .rho-speed {
      display: flex;
      align-items: center;
    }
    .rho-speed-row {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .rho-speed-btn {
      border: 1px solid #555;
      background: #222;
      color: #ccc;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
      line-height: 1;
    }
    .rho-speed-btn:hover {
      background: #333;
    }
    .rho-speed-value {
      font-size: 11px;
      color: #eee;
      min-width: 2.5em;
      text-align: center;
    }
    .step-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-top: 4px;
    }
    .step-btn {
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 11px;
      padding: 2px 0;
      border-radius: 3px;
      cursor: pointer;
    }
    .step-btn.active {
      border-color: #3b82f6;
      background: #1e3a8a;
    }
    #drawBtn {
      width: 100%;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    #drawBtn:hover {
      background: #2563eb;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    #hint {
      margin-top: 4px;
      font-size: 11px;
      color: #aaa;
    }
    #closeUiBtn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: #999;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #closeUiBtn:hover {
      color: #fff;
    }
    #openUiBtn {
      position: fixed;
      top: 40px;
      left: 20px;
      z-index: 100;
      background: rgba(40,40,40,0.75);
      color: #ccc;
      border: 1px solid #555;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #openUiBtn:hover {
      background: rgba(60,60,60,0.9);
      color: #fff;
    }
    #fullscreenBtn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(40,40,40,0.75);
      color: #ccc;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 20px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #fullscreenBtn:hover {
      background: rgba(60,60,60,0.9);
      color: #fff;
    }
    .library-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 10px 0 8px;
    }
    #saveShapeBtn, #copyLinkBtn {
      flex: 1;
      padding: 4px 0;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
    }
    #saveShapeBtn:hover, #copyLinkBtn:hover { background: #333; }
    #copyLinkBtn.copied { border-color: #22c55e; color: #22c55e; }
    .library-header {
      font-size: 11px;
      color: #aaa;
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #libraryList { display: flex; flex-direction: column; gap: 6px; }
    .library-empty { font-size: 10px; color: #666; text-align: center; padding: 6px 0; }
    .library-item {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 5px;
    }
    .library-thumb {
      width: 60px;
      height: 45px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .library-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .library-name {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: 1px solid transparent;
      color: #eee;
      font-size: 11px;
      padding: 1px 3px;
      border-radius: 3px;
      outline: none;
    }
    .library-name:hover, .library-name:focus { border-color: #555; background: #111; }
    .library-btns { display: flex; gap: 3px; }
    .library-btns button {
      flex: 1;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #555;
      background: #222;
      color: #ccc;
      cursor: pointer;
    }
    .library-btns button:hover { background: #333; }
    .library-btn-del { color: #f87171 !important; border-color: #7f1d1d !important; }
    .library-btn-del:hover { background: #450a0a !important; }
  </style>
</head>
<body>
    <button id="openUiBtn" title="Open panel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg></button>
    <div id="ui">
      <button id="closeUiBtn" title="Close panel">✕</button>
      <label for="freqs">Frequency ratios <span class="info-icon" id="freqInfoIcon">i</span></label>
      <input id="freqs" type="text" value="0.5, 0.3, 1/3" />
      <label id="lengthRatiosLabel">Length ratios <span class="info-icon" id="rhoInfoIcon">i</span></label>
      <div id="rhoSliders"></div>
      <label>Angle step <span class="info-icon" id="angleInfoIcon">i</span></label>
      <div id="angleSteps" class="step-grid">
        <button type="button" class="step-btn" data-step="1">1</button>
        <button type="button" class="step-btn" data-step="2">2</button>
        <button type="button" class="step-btn" data-step="3">3</button>
        <button type="button" class="step-btn" data-step="4">4</button>
        <button type="button" class="step-btn" data-step="5">5</button>
        <button type="button" class="step-btn" data-step="6">6</button>
        <button type="button" class="step-btn" data-step="8">8</button>
        <button type="button" class="step-btn" data-step="9">9</button>
        <button type="button" class="step-btn" data-step="10">10</button>
        <button type="button" class="step-btn" data-step="12">12</button>
        <button type="button" class="step-btn" data-step="15">15</button>
        <button type="button" class="step-btn" data-step="18">18</button>
        <button type="button" class="step-btn" data-step="20">20</button>
        <button type="button" class="step-btn" data-step="24">24</button>
        <button type="button" class="step-btn" data-step="30">30</button>
        <button type="button" class="step-btn" data-step="36">36</button>
        <button type="button" class="step-btn" data-step="40">40</button>
        <button type="button" class="step-btn" data-step="45">45</button>
        <button type="button" class="step-btn" data-step="60">60</button>
        <button type="button" class="step-btn" data-step="72">72</button>
        <button type="button" class="step-btn" data-step="90">90</button>
        <button type="button" class="step-btn" data-step="120">120</button>
        <button type="button" class="step-btn" data-step="180">180</button>
        <button type="button" class="step-btn" data-step="360">360</button>
      </div>
      <label>Color palette</label>
      <div id="paletteRow" style="display:flex;gap:4px;margin-bottom:8px;">
        <div class="palette-col active">
          <button type="button" class="palette-btn active" data-mode="bounce">Bounce</button>
          <button type="button" class="palette-rnd-btn" data-mode="bounce">Random</button>
        </div>
        <div class="palette-col">
          <button type="button" class="palette-btn" data-mode="rainbow">Rainbow</button>
          <button type="button" class="palette-rnd-btn" data-mode="rainbow">Random</button>
        </div>
        <div class="palette-col">
          <button type="button" class="palette-btn" data-mode="mono">Mono</button>
          <button type="button" class="palette-rnd-btn" data-mode="mono">Random</button>
        </div>
      </div>
      <div id="colorStepRow">
        <div style="display:flex;align-items:center;gap:6px;margin-top:15px;margin-bottom:10px;">
          <label for="colorStepVal" style="margin:0;">Color step:</label>
          <input id="colorStepVal" type="number" min="1" max="200" step="1" value="50" style="width:3ch;padding:2px 4px;background:#111;color:#eee;border:1px solid #555;border-radius:3px;font-size:12px;outline:none;" />
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <span style="font-size:11px;color:#aaa;flex-shrink:0;">1</span>
          <input id="colorStep" type="range" min="1" max="200" step="1" value="50" style="flex:1;margin:0;" />
          <span style="font-size:11px;color:#aaa;flex-shrink:0;">200</span>
        </div>
      </div>
      <div id="hueRow" style="display:none;margin-bottom:8px;">
        <label for="hueSlider">Hue</label>
        <input id="hueSlider" type="range" min="0" max="359" step="1" value="0" />
      </div>
      <div style="display:flex;align-items:center;position:relative;margin-top:15px;margin-bottom:10px;">
        <label style="margin:0;">Pen width:</label>
        <div id="penWidthControl" style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;">
          <button type="button" class="rho-speed-btn" id="penWidthMin">«</button>
          <button type="button" class="rho-speed-btn" id="penWidthDown">−</button>
          <span id="penWidthValue" style="font-size:11px;color:#eee;min-width:2.5em;text-align:center;">1</span>
          <button type="button" class="rho-speed-btn" id="penWidthUp">+</button>
          <button type="button" class="rho-speed-btn" id="penWidthMax">»</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;position:relative;margin-bottom:10px;">
        <label style="margin:0;">Opacity:</label>
        <div id="opacityControl" style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;">
          <button type="button" class="rho-speed-btn" id="opacityMin">«</button>
          <button type="button" class="rho-speed-btn" id="opacityDown">−</button>
          <span id="opacityValue" style="font-size:11px;color:#eee;min-width:2.5em;text-align:center;">1</span>
          <button type="button" class="rho-speed-btn" id="opacityUp">+</button>
          <button type="button" class="rho-speed-btn" id="opacityMax">»</button>
        </div>
      </div>
      <button id="drawBtn">Draw</button>
      <div style="display:flex;gap:4px;margin-top:6px;">
        <button type="button" id="saveShapeBtn">⬇ Save</button>
        <button type="button" id="copyLinkBtn">🔗 Copy Link</button>
      </div>
      <hr class="library-divider" />
      <div class="library-header"><span id="libraryHeading">Library</span></div>
      <div id="libraryList"></div>
      <div id="hint">
        Scroll to zoom, drag to pan, press Tab to reset zoom.
      </div>
    </div>

  <button id="fullscreenBtn" title="Toggle fullscreen" tabindex="-1"></button>
  <script src="sketch.js"></script>
</body>
</html>
