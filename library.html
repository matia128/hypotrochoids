<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Projects - Hypotrochoid Roulette</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::-webkit-scrollbar {
      width: 4px;
    }
    body::-webkit-scrollbar-track {
      background: transparent;
    }
    body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 8px;
    }
    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .btn {
      border: 1px solid #555;
      background: #222;
      color: #ddd;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #333; }
    #backBtn {
      position: absolute;
      left: -52px;
      top: 50%;
      transform: translateY(calc(-50% - 4px));
      border: none;
      background: transparent;
      color: #ccc;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      padding: 6px 10px;
    }
    #backBtn:hover {
      color: #fff;
    }
    .lib-tabs {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 10px;
    }
    .lib-tab {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      color: #888;
    }
    .lib-tab:hover {
      color: #bbb;
    }
    .lib-tab.active {
      color: #eee;
    }
    .hint {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 14px;
    }
    #list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
    }
    .empty {
      color: #777;
      font-size: 13px;
      border: 1px dashed #444;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    #galleryGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .gallery-item {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(20, 20, 20, 0.9);
    }
    .gallery-item img.gallery-item-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .gallery-item-menu-wrap {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 4;
    }
    .gallery-menu-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: #ccc;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      line-height: 0;
    }
    .gallery-menu-btn:hover {
      color: #fff;
      background: rgba(0, 0, 0, 0.72);
    }
    .gallery-menu-btn span {
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }
    .gallery-menu-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 148px;
      padding: 4px;
      background: rgba(28, 28, 28, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      z-index: 5;
    }
    .gallery-menu-dropdown.is-open {
      display: block;
    }
    .gallery-menu-dropdown button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 0 0 4px;
      padding: 4px 0;
      min-height: 26px;
      border: 1px solid #555;
      border-radius: 3px;
      background: #222;
      color: #ccc;
      font: inherit;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }
    .gallery-menu-dropdown button:last-child {
      margin-bottom: 0;
    }
    .gallery-menu-dropdown button:hover {
      background: #333;
      color: #eee;
    }
    .gallery-menu-dropdown button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .gallery-menu-dropdown .gallery-menu-del {
      background: rgba(220, 38, 38, 0.7);
      color: #fff;
      border-color: rgba(239, 68, 68, 0.8);
    }
    .gallery-menu-dropdown .gallery-menu-del:hover {
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
    }
    .gallery-item-fs-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      z-index: 3;
      width: 32px;
      height: 32px;
      padding: 0;
      margin: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-item-fs-btn:hover {
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
    }
    .gallery-item-fs-btn svg {
      display: block;
    }
    #galleryImageOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10050;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.94);
      box-sizing: border-box;
      padding: 0;
      overflow: hidden;
    }
    #galleryImageOverlay.is-visible {
      display: flex;
    }
    #galleryImageOverlay .gallery-fs-overlay-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 6px;
      background: rgba(40,40,40,0.75);
      color: #ccc;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #galleryImageOverlay .gallery-fs-overlay-close:hover {
      background: rgba(60,60,60,0.9);
      color: #fff;
    }
    #galleryImageOverlay .gallery-fs-overlay-close svg {
      display: block;
    }
    #galleryImageOverlayImg {
      width: auto;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      background: #000;
      flex-shrink: 0;
    }
    #galleryImageOverlay.site-fullscreen #galleryImageOverlayImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.75);
      backdrop-filter: blur(6px);
      padding: 8px;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-date {
      position: absolute;
      left: 10px;
      bottom: 8px;
      margin-top: 12px;
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 20px);
      pointer-events: none;
    }
    .thumb {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      min-height: 80px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #2f2f2f;
      background: #050505;
      flex-shrink: 0;
    }
    .meta {
      min-width: 0;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: auto auto auto 1fr;
      gap: 4px;
      padding: 2px 0;
    }
    .name-row,
    .row {
      display: contents;
    }
    .name {
      grid-column: 1 / -1;
      grid-row: 1;
      min-width: 0;
      height: 26px;
      min-height: 26px;
      box-sizing: border-box;
      border: 1px solid #444;
      background: #0f0f0f;
      color: #eee;
      border-radius: 3px;
      padding: 0 6px;
      font-size: 11px;
      line-height: 24px;
      outline: none;
      align-self: center;
      -webkit-appearance: none;
      appearance: none;
    }
    .name:focus {
      border-color: #3b82f6;
    }
    .meta-text {
      color: #999;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-text-freqs {
      grid-column: 1 / -1;
      grid-row: 2;
    }
    .meta-text-step {
      grid-column: 1 / -1;
      grid-row: 3;
      margin-bottom: 6px;
    }
    .meta .btn {
      min-height: 26px;
      box-sizing: border-box;
      padding: 4px 4px;
      font-size: 11px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .meta .open-btn {
      grid-column: 1;
      grid-row: 4;
      align-self: end;
    }
    .meta .copy-link-btn {
      grid-column: 2;
      grid-row: 4;
      align-self: end;
    }
    .meta .del-btn {
      grid-column: 3;
      grid-row: 4;
      align-self: end;
    }
    .copy-link-btn {
      background: #222;
      color: #ccc;
      border: 1px solid #555;
    }
    .copy-link-btn:hover { background: #333; }
    .copy-link-btn.copied { border-color: #22c55e; color: #22c55e; }
    .open-btn { background: #00b3ffc5; color: #fff; border: none; }
    .open-btn:hover { background: #00aeff; }
    .del-btn { background: rgba(220, 38, 38, 0.7); color: #fff; border-color: rgba(239, 68, 68, 0.8); }
    .del-btn:hover { background: rgba(239, 68, 68, 0.85); }
    #fullscreenBtn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(40,40,40,0.75);
      color: #ccc;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 20px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #fullscreenBtn:hover {
      background: rgba(60,60,60,0.9);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button id="backBtn" type="button" aria-label="Back to app" title="Back to app">←</button>
      <div class="lib-tabs">
        <button type="button" class="lib-tab active" id="tabSaved" aria-pressed="true">Saved projects</button>
        <button type="button" class="lib-tab" id="tabGallery" aria-pressed="false">Gallery</button>
      </div>
    </div>
    <div class="hint" id="libraryHint">Projects are stored in this browser only.</div>
    <div id="list"></div>
    <div id="galleryGrid" style="display:none;"></div>
  </div>
  <div id="galleryImageOverlay" aria-hidden="true">
    <button type="button" class="gallery-fs-overlay-close" aria-label="Close image view"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg></button>
    <img id="galleryImageOverlayImg" alt="Gallery capture" />
  </div>
  <button id="fullscreenBtn" title="Toggle fullscreen" tabindex="-1"></button>

  <script>
    const STORAGE_KEY = "hypo_library";
    const STANDALONE_GALLERY_KEY = "hypo_gallery";
    const FULLSCREEN_STATE_KEY = "hypo_fullscreen_state";
    const ICON_ENTER = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,5 1,1 5,1"/><polyline points="9,1 13,1 13,5"/><polyline points="1,9 1,13 5,13"/><polyline points="9,13 13,13 13,9"/></svg>`;
    const ICON_EXIT  = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,1 5,5 1,5"/><polyline points="9,1 9,5 13,5"/><polyline points="1,9 5,9 5,13"/><polyline points="13,9 9,9 9,13"/></svg>`;

    function getSiteFullscreenRoot() {
      try {
        if (window.top !== window && window.top && window.top.document) return window.top;
      } catch (_) {}
      return window;
    }

    function closeGalleryImageViewOnly() {
      const overlay = document.getElementById("galleryImageOverlay");
      if (!overlay) return;
      overlay.classList.remove("is-visible");
      overlay.classList.remove("site-fullscreen");
      overlay.setAttribute("aria-hidden", "true");
    }

    function syncGalleryImageOverlayMode() {
      const overlay = document.getElementById("galleryImageOverlay");
      if (!overlay) return;
      const root = getSiteFullscreenRoot();
      overlay.classList.toggle("site-fullscreen", !!root.document.fullscreenElement);
    }

    async function enterSiteFullscreen() {
      const root = getSiteFullscreenRoot();
      if (root.document.fullscreenElement) return;
      try {
        await root.document.documentElement.requestFullscreen();
      } catch (e) {
        if (window !== window.top) {
          window.parent.postMessage({ type: "hypo:fullscreen" }, "*");
        } else {
          console.warn("Fullscreen:", e);
        }
      }
    }

    async function openGalleryImageSiteFullscreen(dataUrl) {
      const overlay = document.getElementById("galleryImageOverlay");
      const imgEl = document.getElementById("galleryImageOverlayImg");
      if (!overlay || !imgEl) return;
      imgEl.src = dataUrl;
      await enterSiteFullscreen();
      syncGalleryImageOverlayMode();
      overlay.classList.add("is-visible");
      overlay.setAttribute("aria-hidden", "false");
      requestAnimationFrame(syncGalleryImageOverlayMode);
    }

    function attachGalleryFullscreenSync() {
      try {
        const root = getSiteFullscreenRoot();
        if (root.__hypoLibGalleryFsHook) return;
        root.__hypoLibGalleryFsHook = true;
        root.document.addEventListener("fullscreenchange", () => {
          if (!root.document.fullscreenElement) {
            const ov = document.getElementById("galleryImageOverlay");
            if (ov) {
              ov.classList.remove("is-visible");
              ov.classList.remove("site-fullscreen");
              ov.setAttribute("aria-hidden", "true");
            }
          } else {
            syncGalleryImageOverlayMode();
          }
        });
      } catch (_) {}
    }

    function closeAllGalleryMenus() {
      document.querySelectorAll(".gallery-menu-dropdown.is-open").forEach((d) => d.classList.remove("is-open"));
      document.querySelectorAll(".gallery-menu-btn[aria-expanded='true']").forEach((b) => b.setAttribute("aria-expanded", "false"));
    }

    document.addEventListener("mousedown", (e) => {
      if (!e.target.closest(".gallery-item-menu-wrap")) closeAllGalleryMenus();
    });

    const clipboardCopyCache = new Map();

    function galleryImageToPngBlob(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth || img.width;
          c.height = img.naturalHeight || img.height;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0);
          c.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("Could not encode clipboard PNG"));
          }, "image/png");
        };
        img.onerror = () => reject(new Error("Could not load gallery image"));
        img.src = dataUrl;
      });
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("Could not encode data URL"));
        reader.readAsDataURL(blob);
      });
    }

    function prepareClipboardPng(photo, btn) {
      if (clipboardCopyCache.has(photo.id)) {
        btn.disabled = false;
        btn.textContent = "Copy image";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Preparing...";
      galleryImageToPngBlob(photo.image)
        .then(async (blob) => {
          const dataUrl = await blobToDataUrl(blob);
          const img = await loadImageFully(dataUrl);
          clipboardCopyCache.set(photo.id, { blob, img, dataUrl });
          btn.disabled = false;
          btn.textContent = "Copy image";
        })
        .catch((err) => {
          console.warn("Could not prepare clipboard PNG:", err);
          btn.textContent = "Copy unavailable";
        });
    }

    function getClipboardContext() {
      const contexts = [];
      try {
        if (window.top && window.top !== window) contexts.push(window.top);
      } catch {}
      contexts.push(window);
      return contexts.find((ctx) => {
        try {
          return ctx.navigator.clipboard && ctx.navigator.clipboard.write && ctx.ClipboardItem;
        } catch {
          return false;
        }
      }) || null;
    }

    function loadImageFully(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "sync";
        img.onload = async () => {
          try {
            if (img.decode) await img.decode();
          } catch {}
          resolve(img);
        };
        img.onerror = () => reject(new Error("Could not load image for copy"));
        img.src = src;
      });
    }

    function copyGalleryImageViaSelection(loadedImg) {
      if (!loadedImg) return false;
      const clone = loadedImg.cloneNode(true);
      const box = document.createElement("div");
      box.contentEditable = "true";
      box.style.position = "fixed";
      box.style.left = "0";
      box.style.top = "0";
      box.style.opacity = "0";
      box.style.pointerEvents = "none";
      box.style.zIndex = "-1";
      box.style.width = `${loadedImg.naturalWidth || 1}px`;
      box.style.height = `${loadedImg.naturalHeight || 1}px`;
      box.style.overflow = "hidden";
      box.appendChild(clone);
      document.body.appendChild(box);

      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNode(clone);
      selection.removeAllRanges();
      selection.addRange(range);

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (err) {
        console.warn("execCommand copy failed:", err);
      }
      selection.removeAllRanges();
      if (box.parentNode) box.parentNode.removeChild(box);
      return copied;
    }

    async function copyGalleryImage(photo) {
      let cached = clipboardCopyCache.get(photo.id);
      if (!cached) {
        try {
          const blob = await galleryImageToPngBlob(photo.image);
          const dataUrl = await blobToDataUrl(blob);
          const img = await loadImageFully(dataUrl);
          cached = { blob, img, dataUrl };
          clipboardCopyCache.set(photo.id, cached);
        } catch (err) {
          console.warn("Could not produce clipboard PNG:", err);
        }
      }

      if (!cached) return false;

      const clipboardContext = getClipboardContext();
      if (clipboardContext) {
        try {
          await clipboardContext.navigator.clipboard.write([
            new clipboardContext.ClipboardItem({ "image/png": cached.blob })
          ]);
          return true;
        } catch (err) {
          console.warn("clipboard.write failed:", err);
        }
      }

      try {
        return copyGalleryImageViaSelection(cached.img);
      } catch (err) {
        console.warn("Selection-based copy failed:", err);
      }
      return false;
    }

    function downloadGalleryImage(dataUrl, photoId) {
      const a = document.createElement("a");
      a.href = dataUrl;
      let ext = "png";
      if (dataUrl.startsWith("data:image/jpeg")) ext = "jpg";
      else if (dataUrl.startsWith("data:image/webp")) ext = "webp";
      a.download = `hypo-gallery-${photoId}.${ext}`;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function deleteGalleryPhoto(entryId, photoId, standalone = false, rerender = true) {
      if (standalone) {
        try {
          saveStandaloneGallery(getStandaloneGallery().filter((p) => p.id !== photoId));
        } catch (err) {
          console.warn("Could not delete local gallery photo:", err);
        }
        await deleteIndexedGalleryPhoto(photoId);
        if (rerender) renderGalleryGrid();
        return true;
      }
      const lib = getLibrary();
      const entry = lib.find((x) => x.id === entryId);
      if (!entry || !Array.isArray(entry.gallery)) return false;
      entry.gallery = entry.gallery.filter((p) => p.id !== photoId);
      try {
        saveLibrary(lib);
      } catch (err) {
        console.warn("Could not delete project gallery photo:", err);
        if (rerender) renderGalleryGrid();
        return false;
      }
      if (rerender) renderGalleryGrid();
      return true;
    }

    function getLibrary() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    function saveLibrary(lib) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lib));
    }

    function getStandaloneGallery() {
      try { return JSON.parse(localStorage.getItem(STANDALONE_GALLERY_KEY) || "[]"); }
      catch { return []; }
    }

    function saveStandaloneGallery(gallery) {
      localStorage.setItem(STANDALONE_GALLERY_KEY, JSON.stringify(gallery));
    }

    function openGalleryDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB is unavailable"));
          return;
        }
        const req = indexedDB.open("hypo_gallery_db", 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("Could not open gallery database"));
      });
    }

    async function getIndexedGallery() {
      try {
        const db = await openGalleryDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readonly");
          const req = tx.objectStore("photos").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error || new Error("Could not read gallery photos"));
          tx.oncomplete = () => db.close();
          tx.onerror = () => db.close();
        });
      } catch (err) {
        console.warn("Could not read IndexedDB gallery:", err);
        return [];
      }
    }

    async function deleteIndexedGalleryPhoto(photoId) {
      try {
        const db = await openGalleryDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").delete(photoId);
          tx.oncomplete = () => {
            db.close();
            resolve();
          };
          tx.onerror = () => {
            db.close();
            reject(tx.error || new Error("Could not delete gallery photo"));
          };
        });
      } catch (err) {
        console.warn("Could not delete IndexedDB gallery photo:", err);
      }
    }

    function fallbackDescription(entry) {
      if (entry && entry.description) return entry.description;
      if (entry && entry.createdAt) {
        const d = new Date(entry.createdAt);
        if (!isNaN(d.getTime())) {
          return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }
      }
      return "";
    }

    function encodeShapeToHash(params) {
      const p = new URLSearchParams();
      p.set("freqs", params.freqs || "");
      p.set("rhos", (params.rhos || []).join(","));
      p.set("step", params.step ?? 4);
      p.set("cm", params.colorMode || "bounce");
      p.set("cs", params.colorStep ?? 50);
      p.set("hue", params.monoHue ?? 0);
      p.set("pw", params.penWidth ?? 1);
      p.set("op", params.opacity ?? 1);
      p.set("ro", params.rainbowOffset ?? 0);
      p.set("rc", params.randomColorActive ? "1" : "0");
      p.set("z", params.zoomLevel ?? 1);
      p.set("ox", params.offsetX ?? 0);
      p.set("oy", params.offsetY ?? 0);
      if (params.colorState) {
        p.set("cr", params.colorState.r ?? 0);
        p.set("cg", params.colorState.g ?? 0);
        p.set("cb", params.colorState.b ?? 0);
        p.set("crj", params.colorState.rj ?? 1);
        p.set("cgj", params.colorState.gj ?? 1);
        p.set("cbj", params.colorState.bj ?? 1);
        p.set("ci", params.colorState.initialized ? "1" : "0");
      }
      return p.toString();
    }

    function openProject(entry) {
      const hash = encodeShapeToHash(entry.params || {});
      if (window !== window.top) {
        window.parent.postMessage({ type: "hypo:open", hash, entryId: entry.id }, "*");
      } else {
        const p = new URLSearchParams(hash);
        p.set("lid", entry.id);
        window.location.href = `index.html#${p.toString()}`;
      }
    }

    let viewMode = "saved";

    async function renderGalleryGrid() {
      const grid = document.getElementById("galleryGrid");
      const lib = getLibrary();
      const items = [];
      for (const entry of lib) {
        for (const photo of entry.gallery || []) {
          items.push({ entry, photo, standalone: false });
        }
      }
      for (const photo of getStandaloneGallery()) {
        items.push({ entry: null, photo, standalone: true });
      }
      for (const photo of await getIndexedGallery()) {
        items.push({ entry: null, photo, standalone: true });
      }
      items.sort((a, b) => new Date(b.photo.createdAt) - new Date(a.photo.createdAt));
      grid.innerHTML = "";
      if (items.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No photos yet. Use the camera button to snap the current shape.</div>';
        return;
      }
      for (const { entry, photo, standalone } of items) {
        const wrap = document.createElement("div");
        wrap.className = "gallery-item";

        const menuWrap = document.createElement("div");
        menuWrap.className = "gallery-item-menu-wrap";
        const menuBtn = document.createElement("button");
        menuBtn.type = "button";
        menuBtn.className = "gallery-menu-btn";
        menuBtn.setAttribute("aria-label", "Photo actions");
        menuBtn.setAttribute("aria-haspopup", "true");
        menuBtn.setAttribute("aria-expanded", "false");
        for (let d = 0; d < 3; d++) menuBtn.appendChild(document.createElement("span"));
        const drop = document.createElement("div");
        drop.className = "gallery-menu-dropdown";
        drop.setAttribute("role", "menu");

        const btnCopy = document.createElement("button");
        btnCopy.type = "button";
        btnCopy.textContent = "Copy image";
        btnCopy.setAttribute("role", "menuitem");
        btnCopy.addEventListener("click", async (e) => {
          e.stopPropagation();
          closeAllGalleryMenus();
          menuBtn.setAttribute("aria-expanded", "false");
          const ok = await copyGalleryImage(photo);
          if (!ok) alert("Could not copy image. Try right-clicking the image and choosing 'Copy image'.");
        });

        const btnDl = document.createElement("button");
        btnDl.type = "button";
        btnDl.textContent = "Download";
        btnDl.setAttribute("role", "menuitem");
        btnDl.addEventListener("click", (e) => {
          e.stopPropagation();
          closeAllGalleryMenus();
          menuBtn.setAttribute("aria-expanded", "false");
          downloadGalleryImage(photo.image, photo.id);
        });

        const btnDel = document.createElement("button");
        btnDel.type = "button";
        btnDel.className = "gallery-menu-del";
        btnDel.textContent = "Delete";
        btnDel.setAttribute("role", "menuitem");
        btnDel.addEventListener("click", async (e) => {
          e.stopPropagation();
          closeAllGalleryMenus();
          menuBtn.setAttribute("aria-expanded", "false");
          btnDel.disabled = true;
          const grid = document.getElementById("galleryGrid");
          wrap.remove();
          const deleted = await deleteGalleryPhoto(entry && entry.id, photo.id, standalone, false);
          if (!deleted) {
            renderGalleryGrid();
            return;
          }
          if (grid && !grid.querySelector(".gallery-item")) {
            grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No photos yet. Use the camera button to snap the current shape.</div>';
          }
        });

        drop.appendChild(btnCopy);
        drop.appendChild(btnDl);
        drop.appendChild(btnDel);
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const willOpen = !drop.classList.contains("is-open");
          closeAllGalleryMenus();
          if (willOpen) {
            drop.classList.add("is-open");
            menuBtn.setAttribute("aria-expanded", "true");
            prepareClipboardPng(photo, btnCopy);
          } else {
            menuBtn.setAttribute("aria-expanded", "false");
          }
        });
        menuWrap.appendChild(menuBtn);
        menuWrap.appendChild(drop);

        const fsBtn = document.createElement("button");
        fsBtn.type = "button";
        fsBtn.className = "gallery-item-fs-btn";
        fsBtn.title = "Full screen";
        fsBtn.setAttribute("aria-label", "View full screen");
        fsBtn.innerHTML = ICON_ENTER;
        fsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openGalleryImageSiteFullscreen(photo.image);
        });

        const img = document.createElement("img");
        img.className = "gallery-item-img";
        img.src = photo.image;
        img.alt = "Captured";
        img.decoding = "async";

        wrap.appendChild(img);
        wrap.appendChild(menuWrap);
        wrap.appendChild(fsBtn);
        grid.appendChild(wrap);
      }
    }

    function renderSavedList() {
      const list = document.getElementById("list");
      const lib = getLibrary();
      if (lib.length === 0) {
        list.innerHTML = '<div class="empty">No saved projects yet.</div>';
        return;
      }
      list.innerHTML = "";

      for (const entry of lib) {
        const card = document.createElement("div");
        card.className = "card";

        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.alt = "thumbnail";
        thumb.src = entry.thumbnail || "";
        card.appendChild(thumb);

        const meta = document.createElement("div");
        meta.className = "meta";

        const nameRow = document.createElement("div");
        nameRow.className = "name-row";

        const name = document.createElement("input");
        name.className = "name";
        name.type = "text";
        name.autocomplete = "off";
        name.value = entry.name || "Untitled";
        name.addEventListener("change", () => {
          const lib2 = getLibrary();
          const item = lib2.find(x => x.id === entry.id);
          if (!item) return;
          item.name = name.value.trim() || "Untitled";
          saveLibrary(lib2);
        });
        nameRow.appendChild(name);

        meta.appendChild(nameRow);

        const freqsText = document.createElement("div");
        freqsText.className = "meta-text meta-text-freqs";
        freqsText.textContent = (entry.params && entry.params.freqs) ? `freqs: ${entry.params.freqs}` : "freqs: (empty)";
        meta.appendChild(freqsText);

        const stepText = document.createElement("div");
        stepText.className = "meta-text meta-text-step";
        stepText.textContent = (entry.params && Number.isFinite(entry.params.step)) ? `angle step: ${entry.params.step}` : "angle step: (empty)";
        meta.appendChild(stepText);

        const row = document.createElement("div");
        row.className = "row";

        const openBtn = document.createElement("button");
        openBtn.className = "btn open-btn";
        openBtn.type = "button";
        openBtn.textContent = "Open";
        openBtn.addEventListener("click", () => openProject(entry));

        const linkBtn = document.createElement("button");
        linkBtn.className = "btn copy-link-btn";
        linkBtn.type = "button";
        linkBtn.textContent = "🔗 Copy Link";
        linkBtn.addEventListener("click", () => {
          const hash = encodeShapeToHash(entry.params || {});
          const url = `${window.location.origin}${window.location.pathname.replace(/library\.html$/i, "index.html")}#${hash}`;
          const confirm = (ok) => {
            linkBtn.textContent = ok ? "✓ Copied" : "Copied";
            linkBtn.classList.add("copied");
            setTimeout(() => { linkBtn.textContent = "🔗 Copy Link"; linkBtn.classList.remove("copied"); }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => confirm(true)).catch(() => confirm(false));
          } else {
            const ta = document.createElement("textarea");
            ta.value = url;
            ta.style.cssText = "position:fixed;opacity:0;";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            confirm(true);
          }
        });

        const delBtn = document.createElement("button");
        delBtn.className = "btn del-btn";
        delBtn.type = "button";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => {
          saveLibrary(getLibrary().filter(x => x.id !== entry.id));
          renderSavedList();
          if (viewMode === "gallery") renderGalleryGrid();
        });

        row.appendChild(openBtn);
        row.appendChild(linkBtn);
        row.appendChild(delBtn);
        meta.appendChild(row);
        card.appendChild(meta);

        const dateText = document.createElement("div");
        dateText.className = "card-date";
        dateText.textContent = fallbackDescription(entry);
        card.appendChild(dateText);

        list.appendChild(card);
      }
    }

    function render() {
      if (viewMode === "gallery") renderGalleryGrid();
      else renderSavedList();
    }

    document.getElementById("tabSaved").addEventListener("click", () => {
      viewMode = "saved";
      document.getElementById("tabSaved").classList.add("active");
      document.getElementById("tabGallery").classList.remove("active");
      document.getElementById("list").style.display = "";
      document.getElementById("galleryGrid").style.display = "none";
      const hint = document.getElementById("libraryHint");
      if (hint) hint.style.display = "";
      renderSavedList();
    });
    document.getElementById("tabGallery").addEventListener("click", () => {
      viewMode = "gallery";
      document.getElementById("tabGallery").classList.add("active");
      document.getElementById("tabSaved").classList.remove("active");
      document.getElementById("list").style.display = "none";
      document.getElementById("galleryGrid").style.display = "grid";
      const hint = document.getElementById("libraryHint");
      if (hint) hint.style.display = "none";
      renderGalleryGrid();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      if (window !== window.top) {
        try {
          const parentDoc = window.parent.document;
          const overlay = parentDoc.getElementById("libraryOverlay");
          if (!overlay) throw new Error("no overlay");
          const iframe = overlay.querySelector("iframe");
          overlay.classList.remove("visible");
          parentDoc.getElementById("fullscreenBtn")?.focus();
          if (iframe) iframe.src = "about:blank";
        } catch (e) {
          window.parent.postMessage("hypo:close", "*");
        }
      } else {
        window.location.href = "index.html";
      }
    });

    const doc = document;
    function toggleFullscreen() {
      try {
        if (!doc.fullscreenElement) {
          doc.documentElement.requestFullscreen();
        } else {
          doc.exitFullscreen();
        }
      } catch (e) {
        console.warn("Fullscreen failed:", e);
      }
    }

    const fsBtn = document.getElementById("fullscreenBtn");
    function updateFullscreenButtonIcon() {
      if (fsBtn) fsBtn.innerHTML = doc.fullscreenElement ? ICON_EXIT : ICON_ENTER;
    }
    function saveFullscreenState() {
      try {
        localStorage.setItem(FULLSCREEN_STATE_KEY, doc.fullscreenElement ? "1" : "0");
      } catch (_) {}
    }
    updateFullscreenButtonIcon();
    saveFullscreenState();
    if (window !== window.top) fsBtn.style.display = "none";
    if (fsBtn) fsBtn.addEventListener("click", toggleFullscreen);
    doc.addEventListener("fullscreenchange", () => {
      updateFullscreenButtonIcon();
      saveFullscreenState();
    });
    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      const isTyping = tag === "INPUT" || tag === "TEXTAREA";
      if (e.key === "f" && !isTyping) {
        e.preventDefault();
        if (window !== window.top) {
          const parentDoc = window.parent.document;
          if (parentDoc.fullscreenElement) {
            parentDoc.exitFullscreen();
          } else {
            parentDoc.documentElement.requestFullscreen();
          }
        } else {
          toggleFullscreen();
        }
      }
    });

    document.getElementById("galleryImageOverlay")?.querySelector(".gallery-fs-overlay-close")?.addEventListener("click", () => {
      closeGalleryImageViewOnly();
    });

    attachGalleryFullscreenSync();
    render();
  </script>
</body>
</html>
