<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Projects - Hypotrochoid Roulette</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .btn {
      border: 1px solid #555;
      background: #222;
      color: #ddd;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #333; }
    #backBtn {
      position: absolute;
      left: -58px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #ccc;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      padding: 6px 10px;
    }
    #backBtn:hover {
      color: #fff;
    }
    .hint {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 14px;
    }
    #list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .empty {
      color: #777;
      font-size: 13px;
      border: 1px dashed #444;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .card {
      position: relative;
      border: 1px solid #333;
      border-radius: 8px;
      background: #121212;
      padding: 10px;
      padding-bottom: 26px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .card-date {
      position: absolute;
      left: 10px;
      bottom: 8px;
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 20px);
      pointer-events: none;
    }
    .thumb {
      width: 90px;
      height: 68px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #2f2f2f;
      background: #050505;
      flex-shrink: 0;
    }
    .meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .name {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #444;
      background: #0f0f0f;
      color: #eee;
      border-radius: 5px;
      padding: 5px 6px;
      font-size: 12px;
      margin-bottom: 6px;
      outline: none;
    }
    .name:focus {
      border-color: #3b82f6;
    }
    .meta-text {
      color: #999;
      font-size: 11px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: flex;
      gap: 4px;
      margin-top: auto;
      padding-top: 8px;
    }
    .row .btn {
      flex: 1;
      padding: 4px 0;
      font-size: 12px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button id="backBtn" type="button" aria-label="Back to app" title="Back to app">←</button>
      <h1>Saved Projects</h1>
    </div>
    <div class="hint">Projects are stored in this browser only.</div>
    <div id="list"></div>
  </div>

  <script>
    const STORAGE_KEY = "hypo_library";

    function getLibrary() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    function saveLibrary(lib) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lib));
    }

    function fallbackDescription(entry) {
      if (entry && entry.description) return entry.description;
      if (entry && entry.createdAt) {
        const d = new Date(entry.createdAt);
        if (!isNaN(d.getTime())) {
          return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }
      }
      return "";
    }

    function encodeShapeToHash(params) {
      const p = new URLSearchParams();
      p.set("freqs", params.freqs || "");
      p.set("rhos", (params.rhos || []).join(","));
      p.set("step", params.step ?? 4);
      p.set("cm", params.colorMode || "bounce");
      p.set("cs", params.colorStep ?? 50);
      p.set("hue", params.monoHue ?? 0);
      p.set("pw", params.penWidth ?? 1);
      p.set("op", params.opacity ?? 1);
      p.set("ro", params.rainbowOffset ?? 0);
      p.set("rc", params.randomColorActive ? "1" : "0");
      p.set("z", params.zoomLevel ?? 1);
      p.set("ox", params.offsetX ?? 0);
      p.set("oy", params.offsetY ?? 0);
      if (params.colorState) {
        p.set("cr", params.colorState.r ?? 0);
        p.set("cg", params.colorState.g ?? 0);
        p.set("cb", params.colorState.b ?? 0);
        p.set("crj", params.colorState.rj ?? 1);
        p.set("cgj", params.colorState.gj ?? 1);
        p.set("cbj", params.colorState.bj ?? 1);
        p.set("ci", params.colorState.initialized ? "1" : "0");
      }
      return p.toString();
    }

    function render() {
      const list = document.getElementById("list");
      const lib = getLibrary();
      if (lib.length === 0) {
        list.innerHTML = '<div class="empty">No saved projects yet.</div>';
        return;
      }
      list.innerHTML = "";

      for (const entry of lib) {
        const card = document.createElement("div");
        card.className = "card";

        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.alt = "thumbnail";
        thumb.src = entry.thumbnail || "";
        card.appendChild(thumb);

        const meta = document.createElement("div");
        meta.className = "meta";

        const name = document.createElement("input");
        name.className = "name";
        name.type = "text";
        name.value = entry.name || "Untitled";
        name.addEventListener("change", () => {
          const lib2 = getLibrary();
          const item = lib2.find(x => x.id === entry.id);
          if (!item) return;
          item.name = name.value.trim() || "Untitled";
          saveLibrary(lib2);
        });
        meta.appendChild(name);

        const freqsText = document.createElement("div");
        freqsText.className = "meta-text";
        freqsText.textContent = (entry.params && entry.params.freqs) ? `freqs: ${entry.params.freqs}` : "freqs: (empty)";
        meta.appendChild(freqsText);

        const stepText = document.createElement("div");
        stepText.className = "meta-text";
        stepText.textContent = (entry.params && Number.isFinite(entry.params.step)) ? `angle step: ${entry.params.step}` : "angle step: (empty)";
        meta.appendChild(stepText);

        const row = document.createElement("div");
        row.className = "row";

        const openBtn = document.createElement("button");
        openBtn.className = "btn";
        openBtn.type = "button";
        openBtn.textContent = "Open";
        openBtn.addEventListener("click", () => {
          const hash = encodeShapeToHash(entry.params || {});
          window.location.href = `index.html#${hash}`;
        });

        const linkBtn = document.createElement("button");
        linkBtn.className = "btn";
        linkBtn.type = "button";
        linkBtn.textContent = "Copy Link";
        linkBtn.addEventListener("click", async () => {
          const hash = encodeShapeToHash(entry.params || {});
          const url = `${window.location.origin}${window.location.pathname.replace(/library\.html$/i, "index.html")}#${hash}`;
          try {
            await navigator.clipboard.writeText(url);
            linkBtn.textContent = "Copied!";
            setTimeout(() => { linkBtn.textContent = "Copy Link"; }, 1200);
          } catch {
            linkBtn.textContent = "Copy failed";
            setTimeout(() => { linkBtn.textContent = "Copy Link"; }, 1200);
          }
        });

        const delBtn = document.createElement("button");
        delBtn.className = "btn";
        delBtn.type = "button";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => {
          saveLibrary(getLibrary().filter(x => x.id !== entry.id));
          render();
        });

        row.appendChild(openBtn);
        row.appendChild(linkBtn);
        row.appendChild(delBtn);
        meta.appendChild(row);
        card.appendChild(meta);

        const dateText = document.createElement("div");
        dateText.className = "card-date";
        dateText.textContent = fallbackDescription(entry);
        card.appendChild(dateText);

        list.appendChild(card);
      }
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    render();
  </script>
</body>
</html>
